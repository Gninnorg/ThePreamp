<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <title>ThePreAmp Settings</title>
  <style>
    :root { --bg:#0b0f14; --panel:#141b22; --panel-2:#1a242e; --line:#2d3a45; --text:#edf3f5; --muted:#9cabb5; --aqua:#50d8c0; --orange:#ff8758; --input:#0e141a; }
    * { box-sizing:border-box; } body { margin:0; min-width:320px; background:radial-gradient(ellipse at 100% 0,#17313a 0,transparent 38%),var(--bg); color:var(--text); font:16px "Trebuchet MS",sans-serif; }
    main { max-width:760px; margin:auto; padding:24px 16px 100px; } header { display:flex; justify-content:space-between; align-items:start; padding:8px 2px 29px; }
    h1,h2,p { margin:0; } h1 { font:700 1.45rem Georgia,serif; letter-spacing:1px; } header p { color:var(--muted); font-size:.83rem; margin-top:5px; } header a { color:var(--aqua); font-size:.85rem; text-decoration:none; }
    .section { background:linear-gradient(135deg,#172029,#11181f); border:1px solid var(--line); border-radius:8px; margin-bottom:13px; overflow:hidden; box-shadow:0 10px 26px #00000020; } .section-title { display:flex; align-items:center; gap:10px; padding:16px; border-bottom:1px solid var(--line); } .mark { width:29px; height:29px; border-radius:50%; display:grid; place-items:center; color:var(--aqua); background:#50d8c01c; font:bold .78rem Georgia,serif; } h2 { font-size:1rem; letter-spacing:.2px; }
    .fields { display:grid; gap:15px; padding:16px; } .grid { display:grid; gap:15px; } @media (min-width:570px) { .grid { grid-template-columns:1fr 1fr; } }
    label { display:grid; gap:7px; color:var(--muted); font-size:.78rem; letter-spacing:.3px; } input,select { width:100%; min-height:45px; padding:10px 11px; border:1px solid var(--line); border-radius:5px; background:var(--input); color:var(--text); font:1rem Georgia,serif; } input:focus,select:focus { outline:2px solid var(--aqua); outline-offset:1px; border-color:var(--aqua); }
    .switch { display:flex; align-items:center; justify-content:space-between; gap:18px; color:var(--text); font:1rem Georgia,serif; letter-spacing:0; } .switch input { appearance:none; width:48px; min-width:48px; height:27px; min-height:27px; padding:3px; border:0; border-radius:20px; background:#46525d; cursor:pointer; } .switch input::after { content:""; display:block; width:21px; height:21px; border-radius:50%; background:#dbe7e8; transition:transform .18s ease; } .switch input:checked { background:var(--aqua); } .switch input:checked::after { transform:translateX(21px); background:#09211f; }
    .input-row { display:grid; gap:12px; padding:14px; border:1px solid var(--line); border-radius:6px; background:var(--panel-2); } .input-row strong { color:var(--aqua); font-size:.9rem; }
    .footer { position:fixed; inset:auto 0 0; padding:12px 16px; border-top:1px solid var(--line); background:#0b0f14e8; backdrop-filter:blur(12px); } .footer-inner { display:flex; align-items:center; gap:12px; max-width:760px; margin:auto; } button { min-height:46px; padding:0 19px; border:0; border-radius:5px; background:var(--orange); color:#241008; font:bold .92rem "Trebuchet MS",sans-serif; cursor:pointer; } button:disabled { opacity:.55; } #status { color:var(--muted); font:italic .84rem Georgia,serif; }
  </style>
</head>
<body>
  <main>
    <header><div><h1>ThePreAmp</h1><p>System settings</p></div><a href="/remote">Remote</a></header>
    <form id="settings-form">
      <section class="section"><div class="section-title"><span class="mark">A</span><h2>Audio</h2></div><div class="fields"><div class="grid"><label>Volume steps<input type="number" name="VolumeSteps" min="10" max="255"></label><label>Maximum startup volume<input type="number" name="MaxStartVolume" min="0" max="255"></label><label>Minimum attenuation (dB)<input type="number" name="MinAttenuation" min="0" max="254"></label><label>Maximum attenuation (dB)<input type="number" name="MaxAttenuation" min="1" max="255"></label><label>Mute level<input type="number" name="MuteLevel" min="0" max="255"></label></div><label class="switch">Recall each input's previous volume<input type="checkbox" name="RecallSetLevel"></label><label class="switch">External power relay<input type="checkbox" name="ExtPowerRelayTrigger"></label></div></section>
      <section class="section"><div class="section-title"><span class="mark">I</span><h2>Inputs</h2></div><div class="fields" id="inputs"></div></section>
      <section class="section"><div class="section-title"><span class="mark">T</span><h2>Triggers</h2></div><div class="fields"><div id="triggers"></div><label>Inactive-off timer (seconds)<input type="number" name="TriggerInactOffTimer" min="0" max="255"></label></div></section>
      <section class="section"><div class="section-title"><span class="mark">D</span><h2>Display</h2></div><div class="fields"><div class="grid"><label>Display brightness<select name="DisplayOnLevel"><option value="0">Off</option><option value="1">Low</option><option value="2">Medium</option><option value="3">High</option></select></label><label>Dim brightness<select name="DisplayDimLevel"><option value="0">Off</option><option value="1">Low</option><option value="2">Medium</option><option value="3">High</option></select></label><label>Screen timeout (seconds)<input type="number" name="DisplayTimeout" min="0" max="255"></label><label>Volume display<select name="DisplayVolume"><option value="0">Off</option><option value="1">Steps</option><option value="2">dB</option></select></label><label>Temperature sensor 1<select name="DisplayTemperature1"><option value="0">Off</option><option value="1">Low</option><option value="2">Medium</option><option value="3">High</option></select></label><label>Temperature sensor 2<select name="DisplayTemperature2"><option value="0">Off</option><option value="1">Low</option><option value="2">Medium</option><option value="3">High</option></select></label></div><label class="switch">Show selected input<input type="checkbox" name="DisplaySelectedInput"></label><label class="switch">Enable screen saver<input type="checkbox" name="ScreenSaverActive"></label></div></section>
      <section class="section"><div class="section-title"><span class="mark">W</span><h2>Network</h2></div><div class="fields"><div class="grid"><label>Wi-Fi network<input name="ssid" maxlength="32" autocomplete="off"></label><label>Wi-Fi password<input name="pass" type="password" maxlength="32" autocomplete="new-password"></label><label>Static IP address<input name="ip" maxlength="15" inputmode="decimal" placeholder="Leave blank for DHCP"></label><label>Router address<input name="gateway" maxlength="15" inputmode="decimal" placeholder="Leave blank for DHCP"></label></div></div></section>
    </form>
  </main>
  <div class="footer"><div class="footer-inner"><button id="save" type="submit" form="settings-form">Save settings</button><span id="status" aria-live="polite">Loading settings...</span></div></div>
  <script>
    const form=document.querySelector('#settings-form'),status=document.querySelector('#status'),save=document.querySelector('#save'),active=['Home theater','Normal','Disabled'];
    function setField(name,value){const field=form.elements[name];if(!field)return;if(field.type==='checkbox')field.checked=Boolean(value);else field.value=value??'';}
    function inputEditor(input,index){return `<article class="input-row"><strong>Input ${index+1}</strong><div class="grid"><label>Name<input name="Input.${index}.Name" maxlength="7"></label><label>Mode<select name="Input.${index}.Active">${active.map((label,value)=>`<option value="${value}">${label}</option>`).join('')}</select></label><label>Minimum volume<input type="number" name="Input.${index}.MinVol" min="0" max="255"></label><label>Maximum volume<input type="number" name="Input.${index}.MaxVol" min="0" max="255"></label><label>Gain<input type="number" name="Input.${index}.Gain" min="0" max="255"></label></div></article>`;}
    function triggerEditor(index){const id=index+1;return `<article class="input-row"><strong>Trigger ${id}</strong><div class="grid"><label>Mode<select name="Trigger${id}Active"><option value="0">Disabled</option><option value="1">Enabled</option></select></label><label>Type<select name="Trigger${id}Type"><option value="0">Pulse</option><option value="1">Latched</option></select></label><label>Power-on delay (seconds)<input type="number" name="Trigger${id}OnDelay" min="0" max="255"></label></div></article>`;}
    document.querySelector('#inputs').innerHTML=Array.from({length:5},inputEditor).join('');document.querySelector('#triggers').innerHTML=[0,1].map(triggerEditor).join('');
    function populate(data){Object.entries(data).forEach(([name,value])=>{if(name!=='Input')setField(name,value);});data.Input.forEach((input,index)=>Object.entries(input).forEach(([name,value])=>setField(`Input.${index}.${name}`,value)));status.textContent='Ready';}
    function payload(){const data={Input:[]};new FormData(form).forEach((value,name)=>{if(name.startsWith('Input.')){const[,index,key]=name.split('.');(data.Input[index]??={})[key]=key==='Name'?value:Number(value);}else data[name]=form.elements[name].type==='checkbox'?form.elements[name].checked:(['number','select-one'].includes(form.elements[name].type)?Number(value):value);});['RecallSetLevel','ExtPowerRelayTrigger','DisplaySelectedInput','ScreenSaverActive'].forEach(name=>data[name]=form.elements[name].checked);return data;}
    fetch('/api/settings').then(response=>response.ok?response.json():Promise.reject()).then(populate).catch(()=>status.textContent='Could not load settings');
    form.addEventListener('submit',async event=>{event.preventDefault();save.disabled=true;status.textContent='Saving...';try{const body='settings='+encodeURIComponent(JSON.stringify(payload()));const response=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});if(!response.ok)throw new Error();status.textContent='Saved. Restart the unit after network changes.';}catch{status.textContent='Settings could not be saved.';}finally{save.disabled=false;}});
  </script>
</body>
</html>
